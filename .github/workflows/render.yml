name: Render Deep Dive Video

on:
  push:
    branches: [main]
  # GitHubの画面から「Run workflow」で、書き出すスポットを選んで手動実行できる
  workflow_dispatch:
    inputs:
      spot:
        description: "書き出すスポット(未指定/latestなら最新の1本だけ、allなら全部)"
        required: false
        default: "latest"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存パッケージをインストール
        run: npm install

      - name: 日本語フォントをインストール
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # push(通常のgit push)の場合はspot未指定→"latest"扱いになり、一番新しいスポットだけ書き出す。
      # 手動実行で"all"を選んだ時だけ全部書き出す。特定の名前(例: "izumo")を指定すればそれだけ書き出す。
      - name: 書き出すスポットを決定
        id: pick
        run: |
          SPOT_INPUT="${{ github.event.inputs.spot }}"
          if [ -z "$SPOT_INPUT" ]; then
            SPOT_INPUT="latest"
          fi
          echo "spot=$SPOT_INPUT" >> "$GITHUB_OUTPUT"

      - name: 動画を書き出し
        run: |
          SPOT="${{ steps.pick.outputs.spot }}"
          mkdir -p out
          if [ "$SPOT" = "all" ]; then
            node scripts/list-spots.js | node -e "
              const spots = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              spots.forEach(s => console.log(s.shortId));
            " > /tmp/targets.txt
          elif [ "$SPOT" = "latest" ]; then
            node scripts/list-spots.js --latest > /tmp/targets.txt
          else
            # カンマ区切りで複数指定(例: "izumo,itsukushima")にも対応
            echo "$SPOT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' > /tmp/targets.txt
          fi

          while read -r ID; do
            [ -z "$ID" ] && continue
            COMPOSITION=$(node scripts/list-spots.js | node -e "
              const spots = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const s = spots.find(x => x.shortId === '$ID');
              if (!s) { console.error('spot not found: $ID'); process.exit(1); }
              console.log(s.compositionId + '|' + s.outputFile);
            ")
            COMP_ID="${COMPOSITION%%|*}"
            OUT_FILE="${COMPOSITION##*|}"
            echo "=== 書き出し中: $ID ($COMP_ID → $OUT_FILE) ==="
            npx remotion render "$COMP_ID" "out/$OUT_FILE" || echo "!!! $ID の書き出しに失敗しました(他は続行します) !!!"
          done < /tmp/targets.txt

      - name: 書き出した動画をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: deepdive-videos
          path: out/*.mp4
