name: Render Deep Dive Video

on:
  push:
    branches: [main]
  # GitHubの画面から「Run workflow」で、書き出すスポットを選んで手動実行できる
  workflow_dispatch:
    inputs:
      spot:
        description: "書き出すスポットを選択(未指定なら全部)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - fushimi
          - itsukushima
          - takaya
          - ise
          - kumano
          - izumo

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存パッケージをインストール
        run: npm install

      - name: 日本語フォントをインストール
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # 各ステップは、選択したスポットに一致する場合だけ実行される。
      # pushで自動実行された場合(spot未指定)は全部実行される。
      # continue-on-error: どれか1本が失敗しても、他のスポットの書き出しは止まらない
      - name: 動画を書き出し(伏見稲荷)
        if: github.event.inputs.spot == 'fushimi' || github.event.inputs.spot == 'all' || github.event.inputs.spot == ''
        continue-on-error: true
        run: npx remotion render DeepDive-FushimiInari out/fushimi-inari.mp4

      - name: 動画を書き出し(厳島神社)
        if: github.event.inputs.spot == 'itsukushima' || github.event.inputs.spot == 'all' || github.event.inputs.spot == ''
        continue-on-error: true
        run: npx remotion render DeepDive-Itsukushima out/itsukushima.mp4

      - name: 動画を書き出し(高屋神社)
        if: github.event.inputs.spot == 'takaya' || github.event.inputs.spot == 'all' || github.event.inputs.spot == ''
        continue-on-error: true
        run: npx remotion render DeepDive-Takaya out/takaya.mp4

      - name: 動画を書き出し(伊勢神宮)
        if: github.event.inputs.spot == 'ise' || github.event.inputs.spot == 'all' || github.event.inputs.spot == ''
        continue-on-error: true
        run: npx remotion render DeepDive-Ise out/ise.mp4

      - name: 動画を書き出し(熊野本宮大社)
        if: github.event.inputs.spot == 'kumano' || github.event.inputs.spot == 'all' || github.event.inputs.spot == ''
        continue-on-error: true
        run: npx remotion render DeepDive-Kumano out/kumano.mp4

      - name: 動画を書き出し(出雲大社)
        if: github.event.inputs.spot == 'izumo' || github.event.inputs.spot == 'all' || github.event.inputs.spot == ''
        continue-on-error: true
        run: npx remotion render DeepDive-Izumo out/izumo.mp4

      - name: 書き出した動画をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: deepdive-videos
          path: out/*.mp4
