name: Render Deep Dive Video

# mainブランチにpushされたら自動で実行される
on:
  push:
    branches: [main]
  # GitHubの画面から手動でも実行できるようにする
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存パッケージをインストール
        run: npm install

      - name: 日本語フォントをインストール
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 動画を書き出し(伏見稲荷)
        run: npx remotion render DeepDive-FushimiInari out/fushimi-inari.mp4

      - name: 動画を書き出し(厳島神社)
        run: npx remotion render DeepDive-Itsukushima out/itsukushima.mp4

      - name: 動画を書き出し(高屋神社)
        run: npx remotion render DeepDive-Takaya out/takaya.mp4

      - name: 動画を書き出し(伊勢神宮)
        run: npx remotion render DeepDive-Ise out/ise.mp4

      - name: 動画を書き出し(熊野本宮大社)
        run: npx remotion render DeepDive-Kumano out/kumano.mp4

      - name: 書き出した動画をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: deepdive-videos
          path: out/*.mp4
